name: Monitor Orari UniBG

on:
  schedule:
    # Ogni ora dalle 7:00 alle 22:00 (UTC+2 = CEST), dal lunedì al sabato
    - cron: "0 5-20 * * 1-6"
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Rimossa la dipendenza beautifulsoup4, basta requests
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit updated snapshot (se cambiato)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git diff --cached --quiet || git commit -m "chore: aggiorna snapshot orari [skip ci]"
          git push